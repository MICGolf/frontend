name: Deploy to S3 And Invalidate Cloudfront

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository Checkout
        uses: actions/checkout@v4

      - name: node_modules, package-lock.json 삭제
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: 의존성 패키지 설치
        run: npm install

      - name: 빌드
        env:
          VITE_SWEETTRACKER_API_KEY: ${{secrets.VITE_SWEETTRACKER_API_KEY}}
          VITE_PUBLIC_BASEURL: ${{secrets.VITE_PUBLIC_BASEURL}}
          VITE_KAKAO_REST_API_KEY: ${{secrets.VITE_KAKAO_REST_API_KEY}}
          VITE_KAKAO_REDIRECT_URI: ${{secrets.VITE_KAKAO_REDIRECT_URI}}
          VITE_NAVER_CLIENT_ID: ${{secrets.VITE_NAVER_CLIENT_ID}}
          VITE_NAVER_REDIRECT_URI: ${{secrets.VITE_NAVER_REDIRECT_URI}}
          VITE_PORTONE_SECRET_KEY: ${{secrets.VITE_PORTONE_SECRET_KEY}}
          VITE_PORTONE_STORE_ID: ${{secrets.VITE_PORTONE_STORE_ID}}
          VITE_PORTONE_CHANNEL_KEY: ${{secrets.VITE_PORTONE_CHANNEL_KEY}}
        run: npm run build

      - name: 빌드 파일 디버깅
        run: |
          ls
          echo "---------------------------------"
          cd dist
          ls

      - name: AWS Resource 접근 권한 AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: AWS S3 기존 파일 삭제
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: aws s3 rm --recursive s3://micgolf

      - name: AWS S3 빌드 파일 재배포
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: aws s3 cp ./dist s3://micgolf/ --recursive

      - name: Cloudfront 캐시 무효화
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: aws cloudfront create-invalidation --distribution-id E195L0YEFMREX0 --paths "/*"
